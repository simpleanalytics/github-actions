name: Pull Request

on:
  workflow_call:
    inputs:
      internal_app:
        description: "Set true for internal apps where low-risk changes do not require approval"
        type: boolean
        required: false
        default: false
      claude_model:
        description: "Claude model used for SDLC risk classification"
        type: string
        required: false
        default: claude-sonnet-5-5
      claude_extra_prompt:
        description: "Optional repository-specific Claude classification instructions"
        type: string
        required: false
        default: ""
      claude_allowed_bots:
        description: "Comma-separated bot actors allowed to trigger SDLC risk classification"
        type: string
        required: false
        default: "github-actions,github-actions[bot],simple-analytics-ai"
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  sdlc-label:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && github.event_name == 'pull_request' && contains(fromJson('["opened", "reopened", "synchronize"]'), github.event.action) }}
    concurrency:
      group: sdlc-label-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Ensure SDLC labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              {
                name: 'change: needs review',
                color: 'b60205',
                description: 'Significant or emergency change affecting security, data protection, or stability',
              },
              {
                name: 'change: routine',
                color: 'fbca04',
                description: 'Routine or ordinary change that needs at most one human or AI-assisted review',
              },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }

      - name: Capture existing SDLC label
        id: existing_sdlc_label
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const existingLabel = ['change: needs review', 'change: routine'].find((label) => labels.includes(label)) || '';
            core.setOutput('label', existingLabel);

      - name: Capture existing linked issue
        id: existing_issue
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const nameWithOwner = `${owner}/${repo}`;
            const prNumber = context.payload.pull_request.number;
            const refs = [];

            function addBodyRefs(body) {
              const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:[\w.-]+\/[\w.-]+)?#\d+)/gi;
              let match;

              while ((match = pattern.exec(body || '')) !== null) {
                refs.push(match[1]);
              }
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            addBodyRefs(pullRequest.body || '');

            try {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 20) {
                        nodes {
                          number
                          repository {
                            nameWithOwner
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner, repo, number: prNumber });

              for (const issue of result.repository.pullRequest.closingIssuesReferences.nodes) {
                refs.push(issue.repository.nameWithOwner === nameWithOwner
                  ? `#${issue.number}`
                  : `${issue.repository.nameWithOwner}#${issue.number}`);
              }
            } catch (error) {
              core.warning(`Could not capture closingIssuesReferences via GraphQL: ${error.message}`);
            }

            const issueRef = refs.find(Boolean) || '';
            core.setOutput('ref', issueRef);
            core.info(issueRef
              ? `Captured existing linked issue ${issueRef}.`
              : 'No existing linked issue was found.');

      - name: Classify PR description provenance
        id: description_provenance
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const capturedAt = new Date().toISOString();
            const workflowLogins = new Set(['github-actions', 'github-actions[bot]']);
            const knownAutomatedLogins = new Set([
              'claude',
              'claude[bot]',
              'github-actions',
              'github-actions[bot]',
              'simple-analytics-ai',
              'simple-analytics-ai[bot]',
            ]);

            function normalizedLogin(login) {
              return String(login || '').trim().toLowerCase();
            }

            function loginLooksAutomated(login) {
              const normalized = normalizedLogin(login);
              if (!normalized) return false;
              if (knownAutomatedLogins.has(normalized)) return true;
              return /(?:^|[-_])(ai|bot|chatgpt|claude|codex|openai)(?:$|[-_\[])/i.test(normalized);
            }

            function actorIsAutomated(actor) {
              const type = actor?.type || actor?.__typename || '';
              return type === 'Bot' || type === 'App' || loginLooksAutomated(actor?.login);
            }

            function actorIsHuman(actor) {
              const type = actor?.type || actor?.__typename || '';
              return type === 'User' && !loginLooksAutomated(actor?.login);
            }

            function identityTextLooksAutomated(...values) {
              const text = values.filter(Boolean).join(' ');
              return /\b(?:chatgpt|claude|codex|openai)\b|codex@simpleanalytics\.invalid|@anthropic\.com/i.test(text);
            }

            function bodyLooksAutomated(body) {
              return [
                /(?:generated|written|created)\s+(?:with|by)\s+(?:an?\s+)?(?:ai|chatgpt|claude|codex|openai)\b/i,
                /co-authored-by:\s*(?:chatgpt|claude|codex|openai)\b/i,
                /<!--\s*(?:ai|chatgpt|claude|codex|openai)[^>]*(?:generated|written|created)/i,
              ].some((pattern) => pattern.test(body || ''));
            }

            function commitLooksAutomated(commit) {
              return (
                actorIsAutomated(commit.author) ||
                actorIsAutomated(commit.committer) ||
                identityTextLooksAutomated(
                  commit.commit?.author?.name,
                  commit.commit?.author?.email,
                  commit.commit?.committer?.name,
                  commit.commit?.committer?.email,
                  commit.commit?.message
                )
              );
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const body = pullRequest.body || '';
            const edits = [];

            try {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      userContentEdits(first: 100) {
                        nodes {
                          editedAt
                          editor {
                            __typename
                            login
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner, repo, number: prNumber });

              edits.push(...(result.repository.pullRequest.userContentEdits.nodes || []));
            } catch (error) {
              core.warning(`Could not inspect PR description edit history: ${error.message}`);
            }

            edits.sort((left, right) => new Date(right.editedAt) - new Date(left.editedAt));

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const automatedCommits = commits.filter(commitLooksAutomated);
            const humanEdit = edits.find((edit) => actorIsHuman(edit.editor));
            const latestNonWorkflowEdit = edits.find((edit) =>
              edit.editor && !workflowLogins.has(normalizedLogin(edit.editor.login))
            );
            const pullRequestAuthor = pullRequest.user;
            const automatedBranch = /^(?:ai|bot|chatgpt|claude|codex)[\/-]/i.test(pullRequest.head?.ref || '');
            const explicitBodySignal = bodyLooksAutomated(body);
            const workflowBodySignal = body.includes('<!-- simpleanalytics:changes-start -->');

            let kind = 'human';
            let reason = 'No reliable automation signal was found; preserving the description as human-authored.';

            if (humanEdit) {
              reason = `A human (${humanEdit.editor.login}) edited the description; human content takes precedence over every automation signal.`;
            } else if (latestNonWorkflowEdit && actorIsAutomated(latestNonWorkflowEdit.editor)) {
              kind = 'automated';
              reason = `The latest substantive description editor is automated (${latestNonWorkflowEdit.editor.login}).`;
            } else if (explicitBodySignal) {
              kind = 'automated';
              reason = 'The description contains an explicit AI-generation marker.';
            } else if (actorIsHuman(pullRequestAuthor)) {
              reason = `The pull request author is human (${pullRequestAuthor.login}) and no direct description signal indicates automation.`;
            } else if (actorIsAutomated(pullRequestAuthor)) {
              kind = 'automated';
              reason = `The pull request author is automated (${pullRequestAuthor.login}).`;
            } else if (commits.length > 0 && automatedCommits.length === commits.length) {
              kind = 'automated';
              reason = 'Every pull request commit has an automated author, committer, or AI attribution.';
            } else if (automatedBranch && automatedCommits.length > 0) {
              kind = 'automated';
              reason = 'The agent branch name and commit attribution both indicate automation.';
            } else if (workflowBodySignal && automatedCommits.length > 0) {
              kind = 'automated';
              reason = 'The workflow-managed description marker and commit attribution both indicate automation.';
            }

            core.setOutput('kind', kind);
            core.setOutput('reason', reason);
            core.setOutput('body_base64', Buffer.from(body, 'utf8').toString('base64'));
            core.setOutput('captured_at', capturedAt);
            core.info(`Classified the existing PR description as ${kind}: ${reason}`);

      - name: Checkout pull request branch
        if: ${{ steps.existing_sdlc_label.outputs.label == '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch
        if: ${{ steps.existing_sdlc_label.outputs.label == '' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git remote add base "https://github.com/${{ github.repository }}.git" 2>/dev/null || git remote set-url base "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags --prune --depth=200 base "$BASE_REF"

      - name: Classify SDLC risk with Claude
        id: claude
        if: ${{ steps.existing_sdlc_label.outputs.label == '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: ${{ inputs.claude_allowed_bots }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            FULL PR RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            INTERNAL APP: ${{ inputs.internal_app }}
            EXISTING LINKED ISSUE: ${{ steps.existing_issue.outputs.ref }}

            Classify the SDLC risk of this pull request. Code review is handled elsewhere: do not report findings, post comments, edit files, or change the pull request.
            Read the change with `git log` and `git diff` on FULL PR RANGE, and inspect surrounding code only when needed to judge impact.

            SDLC label rules:
            - Return exactly one of `change: needs review` or `change: routine` in `sdlc_label` and a short reason in `sdlc_reason`, without the label prefix or "because".
            - Never apply labels or post an SDLC label message yourself. The workflow applies the label and posts the reason.
            - The labels follow the release risk levels of the Simple Analytics Software Release and Deployment Procedure:
              - `change: routine` covers Routine Changes (standard, repeatable, low-risk changes with minimal operational impact) and Review Required Changes (changes affecting application behavior, infrastructure, integrations, or customer experience). They need at most one review, which may be AI-assisted.
              - `change: needs review` covers Significant Changes (high-impact changes, infrastructure modifications, security-sensitive changes, or changes with potential customer impact) and Emergency Changes (critical changes that restore service availability or address security issues). They need a human review, after deployment for Emergency Changes.
            - Start with `change: routine`. Use `change: needs review` only when the full PR diff establishes at least one concrete, material impact listed below.
            - Use `change: needs review` for a material change to:
              - who can access customer, user, or sensitive data, or how that data is collected, exposed, shared, transferred, deleted, or retained;
              - use of production data outside production, or the anonymization of production data for debugging or testing;
              - authentication, authorization, permissions, privacy controls, or security boundaries, including fixes for security vulnerabilities;
              - prices, charges, invoices, subscriptions, or other billing behavior;
              - database schemas, data migrations, or destructive or bulk data operations;
              - production infrastructure, routing, certificates, secrets, deployment safety, or rollback behavior;
              - concurrency, queues, storage, retries, or reliability where the diff creates a credible outage, data-loss, or corruption risk;
              - account or team deletion, data exports or transfers, or similarly critical system functionality; or
              - an emergency fix that restores service during a production incident.
            - Use `change: routine` for all other changes, including ordinary product features and bug fixes, UI or display settings, copy or terminology, design, content, refactors, tests, documentation, internal tools, developer tooling, and dependency maintenance such as package or runtime updates within the same major version, that do not materially change one of the risks above.
            - Routine examples include relabeling an existing analytics field without changing its collection or storage, and adding view display settings while preserving existing authorization and data-lifecycle boundaries.
            - Needs-review examples include changing tenant or JWT authorization scope, account deletion behavior, bulk data migrations, billing calculations, or production certificate and routing behavior.
            - Merely touching production code, changing user-visible behavior, or mentioning customers, users, data, security, or privacy is not enough to require review.
            - If INTERNAL APP is true and the PR does not touch customer/user data, security, privacy, or critical functionality, use `change: routine`.
            - If the evidence is uncertain or no concrete material impact can be named, use `change: routine`.
            - For `change: needs review`, write `sdlc_reason` as the concrete security, data, or stability impact, because the workflow also uses it as the PR's security implications.

            Issue description rules:
            - If your assessment is `change: needs review` and EXISTING LINKED ISSUE is empty, return an issue draft through the structured output fields. Otherwise, return empty strings and an empty array for them.
            - `issue_title` must describe the unresolved problem. Do not prefix it with `Track:` and do not refer to the pull request.
            - `issue_problem` must describe the current problem, symptoms, impact, and useful known context in present tense. Do not claim that anything was fixed, changed, added, or implemented, and do not refer to a PR.
            - `issue_suggested_changes` must contain concise proposed outcomes, investigation areas, or requirements. Treat them as suggestions, not completed work or an exact implementation.
            - Do not include Markdown section headings in the structured fields and do not prefix suggested-change entries with bullets; the workflow adds the issue formatting.

            Extra repository instructions:
            ${{ inputs.claude_extra_prompt }}
          claude_args: |
            --model ${{ inputs.claude_model }}
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Glob,Grep,Read"
            --json-schema '{"type":"object","properties":{"sdlc_label":{"type":"string","enum":["change: routine","change: needs review"]},"sdlc_reason":{"type":"string"},"issue_title":{"type":"string"},"issue_problem":{"type":"string"},"issue_suggested_changes":{"type":"array","items":{"type":"string"}}},"required":["sdlc_label","sdlc_reason","issue_title","issue_problem","issue_suggested_changes"],"additionalProperties":false}'

      - name: Finalize SDLC label
        id: sdlc_label
        uses: actions/github-script@v9
        env:
          EXISTING_SDLC_LABEL: ${{ steps.existing_sdlc_label.outputs.label }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        with:
          script: |
            const needsReview = 'change: needs review';
            const routine = 'change: routine';
            const issueNumber = context.payload.pull_request.number;

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const currentLabel = [needsReview, routine].find((label) => labels.includes(label));
            const existingLabel = currentLabel || process.env.EXISTING_SDLC_LABEL;
            let assessment = {};
            try {
              assessment = JSON.parse(process.env.CLAUDE_STRUCTURED_OUTPUT || '{}') || {};
            } catch (error) {
              core.warning(`Could not read Claude's SDLC assessment: ${error.message}`);
            }
            const assessedLabel = [needsReview, routine].includes(assessment.sdlc_label) ? assessment.sdlc_label : '';
            const finalLabel = existingLabel || assessedLabel || routine;
            const reason = typeof assessment.sdlc_reason === 'string' ? assessment.sdlc_reason.trim() : '';
            let shouldComment = !existingLabel && Boolean(assessedLabel && reason);

            if (shouldComment) {
              const [comments, reviews] = await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                  per_page: 100,
                }),
              ]);
              shouldComment = ![...comments, ...reviews].some((message) => /\bSDLC label\s*:/i.test(message.body || ''));
            }

            if (!currentLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [finalLabel],
              });
            }

            if (shouldComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `SDLC label: \`${finalLabel}\` because ${reason}`,
              });
            }

            core.setOutput('label', finalLabel);
            core.setOutput('requires_review', String(finalLabel === needsReview));

      - name: Enforce review-required PR template
        if: ${{ steps.sdlc_label.outputs.requires_review == 'true' }}
        uses: actions/github-script@v9
        env:
          EXISTING_ISSUE_REF: ${{ steps.existing_issue.outputs.ref }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          DESCRIPTION_PROVENANCE: ${{ steps.description_provenance.outputs.kind }}
          ORIGINAL_PR_BODY_BASE64: ${{ steps.description_provenance.outputs.body_base64 }}
          DESCRIPTION_CAPTURED_AT: ${{ steps.description_provenance.outputs.captured_at }}
        with:
          script: |
            const needsReview = 'change: needs review';
            const eventPullRequest = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = eventPullRequest.number;
            const nameWithOwner = `${owner}/${repo}`;
            const changeSummaryStart = '<!-- simpleanalytics:changes-start -->';
            const changeSummaryEnd = '<!-- simpleanalytics:changes-end -->';

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            async function closingIssueRefsFromGraphql() {
              try {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        closingIssuesReferences(first: 20) {
                          nodes {
                            number
                            url
                            repository {
                              nameWithOwner
                            }
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, number: prNumber });

                return result.repository.pullRequest.closingIssuesReferences.nodes.map((issue) => ({
                  ref: issue.repository.nameWithOwner === nameWithOwner ? `#${issue.number}` : `${issue.repository.nameWithOwner}#${issue.number}`,
                  url: issue.url,
                }));
              } catch (error) {
                core.warning(`Could not read closingIssuesReferences via GraphQL: ${error.message}`);
                return [];
              }
            }

            function closingIssueRefsFromBody(body) {
              const refs = [];
              const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:[\w.-]+\/[\w.-]+)?#\d+)/gi;
              let match;

              while ((match = pattern.exec(body || '')) !== null) {
                refs.push({ ref: match[1], url: '' });
              }

              return refs;
            }

            function uniqueRefs(refs) {
              const seen = new Set();
              return refs.filter((item) => {
                if (!item.ref || seen.has(item.ref)) return false;
                seen.add(item.ref);
                return true;
              });
            }

            function escapeRegExp(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function findSection(body, title) {
              const headings = [...String(body || '').matchAll(/^##\s+(.+?)\s*$/gm)];
              const index = headings.findIndex((heading) => heading[1].trim().toLowerCase() === title.toLowerCase());
              if (index === -1) return null;

              const heading = headings[index];
              const headingStart = heading.index;
              const headingEnd = headingStart + heading[0].length;
              let contentStart = headingEnd;

              if (body.slice(contentStart, contentStart + 2) === '\r\n') contentStart += 2;
              else if (body[contentStart] === '\n') contentStart += 1;

              return {
                headingStart,
                contentStart,
                sectionEnd: headings[index + 1]?.index ?? body.length,
              };
            }

            function extractSection(body, title) {
              const section = findSection(body, title);
              return section ? body.slice(section.contentStart, section.sectionEnd).trim() : '';
            }

            function setSection(body, title, content) {
              const rendered = `## ${title}\n\n${String(content || '').trim()}`;
              const section = findSection(body, title);

              if (!section) {
                return [String(body || '').trimEnd(), rendered].filter(Boolean).join('\n\n').concat('\n');
              }

              const before = body.slice(0, section.headingStart);
              const after = body.slice(section.sectionEnd);
              return `${before}${rendered}${after ? `\n\n${after}` : '\n'}`;
            }

            function ensureSummary(body, fallback) {
              if (findSection(body, 'Summary')) return body;

              const value = String(body || '');
              const firstHeading = /^##\s+/m.exec(value);

              if (firstHeading?.index > 0 && value.slice(0, firstHeading.index).trim()) {
                return `## Summary\n\n${value.slice(0, firstHeading.index).trimEnd()}\n\n${value.slice(firstHeading.index)}`;
              }

              if (!firstHeading && value.trim()) return `## Summary\n\n${value.trim()}\n`;
              return `## Summary\n\n${fallback}\n\n${value.trimStart()}`.trimEnd().concat('\n');
            }

            function normalizeChecklist(value, states, preserveExistingExtras) {
              const required = [
                { label: 'Linked to an issue', checked: states.linkedIssue },
                { label: 'Tested', checked: states.tested },
                { label: 'Asked for a review', checked: states.askedForReview },
              ];
              const requiredByLabel = new Map(required.map((item) => [item.label.toLowerCase(), item]));
              const seen = new Set();
              const lines = preserveExistingExtras ? String(value || '').split(/\r?\n/) : [];
              const output = [];

              for (const line of lines) {
                const item = line.trim().match(/^-\s*\[[ xX]\]\s*(Linked to an issue|Tested|Asked for a review)\s*\.?$/i);
                if (!item) {
                  output.push(line);
                  continue;
                }

                const key = item[1].toLowerCase();
                if (seen.has(key)) continue;
                const requiredItem = requiredByLabel.get(key);
                output.push(`- [${requiredItem.checked ? 'x' : ' '}] ${requiredItem.label}`);
                seen.add(key);
              }

              for (const item of required) {
                const key = item.label.toLowerCase();
                if (!seen.has(key)) output.push(`- [${item.checked ? 'x' : ' '}] ${item.label}`);
              }

              return output.join('\n').trim();
            }

            function protectedMediaTokens(value) {
              const patterns = [
                /<picture\b[\s\S]*?<\/picture>/gi,
                /<img\b[^>]*>/gi,
                /!\[[^\]\n]*\]\(\s*(?:<[^>\n]+>|[^)\n]+)\s*\)/g,
                /!\[[^\]\n]*\]\[[^\]\n]*\]/g,
                /^\s*\[[^\]\n]+\]:\s+(?:<[^>\n]+>|\S+).*$/gm,
                /https:\/\/github\.com\/user-attachments\/assets\/[A-Za-z0-9-]+/g,
              ];
              const tokens = [];

              for (const pattern of patterns) {
                for (const match of String(value || '').matchAll(pattern)) tokens.push(match[0].trim());
              }

              return [...new Set(tokens.filter(Boolean))];
            }

            function mediaIdentity(token) {
              const markdown = token.match(/!\[[^\]]*\]\(\s*<?([^>\s)]+)>?/);
              if (markdown?.[1]) return markdown[1];
              const html = token.match(/\bsrc=["']([^"']+)["']/i);
              if (html?.[1]) return html[1];
              const attachment = token.match(/https:\/\/github\.com\/user-attachments\/assets\/[A-Za-z0-9-]+/);
              return attachment?.[0] || token;
            }

            function preserveProtectedMedia(originalBody, body) {
              const existing = new Set(protectedMediaTokens(body).map(mediaIdentity));
              const missing = [];

              for (const token of protectedMediaTokens(originalBody)) {
                const identity = mediaIdentity(token);
                if (existing.has(identity)) continue;
                existing.add(identity);
                missing.push(token);
              }

              if (!missing.length) return body;

              const screenshots = extractSection(body, 'Screenshots');
              return setSection(body, 'Screenshots', [screenshots, ...missing].filter(Boolean).join('\n\n'));
            }

            async function latestDescriptionEditIsHumanSinceCapture() {
              const capturedAt = Date.parse(process.env.DESCRIPTION_CAPTURED_AT || '');
              if (!Number.isFinite(capturedAt)) return false;

              try {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        userContentEdits(last: 100) {
                          nodes {
                            editedAt
                            editor {
                              __typename
                              login
                            }
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, number: prNumber });
                const latestEdit = (result.repository.pullRequest.userContentEdits.nodes || [])
                  .filter((edit) => Date.parse(edit.editedAt) > capturedAt)
                  .sort((left, right) => new Date(right.editedAt) - new Date(left.editedAt))[0];
                const login = String(latestEdit?.editor?.login || '').toLowerCase();
                const automatedLogin = /(?:^|[-_])(ai|bot|chatgpt|claude|codex|openai)(?:$|[-_\[])/i.test(login);

                return latestEdit?.editor?.__typename === 'User' && !automatedLogin;
              } catch (error) {
                core.warning(`Could not check for a newer human PR description edit: ${error.message}`);
                return false;
              }
            }

            function checked(existingChecklist, label) {
              const expression = new RegExp(`-\\s*\\[[xX]\\]\\s*${escapeRegExp(label)}`, 'i');
              return expression.test(existingChecklist || '');
            }

            function stripGeneratedChangeSummary(value) {
              const expression = new RegExp(`${escapeRegExp(changeSummaryStart)}[\\s\\S]*?${escapeRegExp(changeSummaryEnd)}`, 'g');
              return (value || '').replace(expression, '').trim();
            }

            function cleanSummaryText(value) {
              return stripGeneratedChangeSummary(value)
                .replace(/^\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:[\w.-]+\/[\w.-]+)?#\d+)\s*$/gim, '')
                .replace(/^\s*No linked issue was created automatically\.\s*$/gim, '')
                .replace(/\bDescribe the change\.\s*/gi, '')
                .trim();
            }

            function compactWhitespace(value) {
              return (value || '').replace(/\s+/g, ' ').trim();
            }

            function truncate(value, maxLength) {
              const text = compactWhitespace(value);
              if (text.length <= maxLength) return text;
              return `${text.slice(0, Math.max(0, maxLength - 1)).trimEnd()}...`;
            }

            function firstBodyParagraph(message) {
              return (message || '')
                .split(/\r?\n\r?\n/)
                .map((paragraph) => paragraph
                  .split(/\r?\n/)
                  .map((line) => line.trim())
                  .filter((line) =>
                    line &&
                    !/^Signed-off-by:/i.test(line) &&
                    !/^Co-authored-by:/i.test(line)
                  )
                  .join(' ')
                )
                .find(Boolean) || '';
            }

            function parseCommitMessage(message) {
              const lines = (message || '').split(/\r?\n/);
              const subject = compactWhitespace(lines.shift() || '');
              const body = lines.join('\n').trim();
              return {
                subject,
                reason: firstBodyParagraph(body),
              };
            }

            function isBranchUpdateCommit(subject) {
              return /^(merge (branch|remote-tracking branch|pull request)|update branch|sync (main|master)|chore:?\s*(merge|sync)\b)/i.test(subject || '');
            }

            async function buildCommitChangeSummary() {
              try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                });

                const parsedCommits = commits
                  .map((commit) => parseCommitMessage(commit.commit?.message || ''))
                  .filter((commit) => commit.subject);
                const reviewCommits = parsedCommits.filter((commit) => !isBranchUpdateCommit(commit.subject));
                const sourceCommits = reviewCommits.length ? reviewCommits : parsedCommits;
                const selectedCommits = sourceCommits.slice(-6);
                const omittedCount = sourceCommits.length - selectedCommits.length;

                if (!selectedCommits.length) return '';

                const bullets = selectedCommits.map((commit) => {
                  const subject = truncate(commit.subject, 140);
                  const reason = truncate(commit.reason, 180);
                  return reason ? `- ${subject} - ${reason}` : `- ${subject}`;
                });

                if (omittedCount > 0) {
                  bullets.push(`- ...and ${omittedCount} earlier commit(s).`);
                }

                return [
                  changeSummaryStart,
                  'Changes:',
                  ...bullets,
                  changeSummaryEnd,
                ].join('\n');
              } catch (error) {
                core.warning(`Could not build commit-based PR summary: ${error.message}`);
                return '';
              }
            }

            async function buildFallbackSummary() {
              const cleanedBody = cleanSummaryText(currentBody);
              if (cleanedBody) return cleanedBody;

              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                });
                const paths = files.slice(0, 8).map((file) => `- \`${file.filename}\``);
                const omitted = files.length > paths.length ? `\n- ...and ${files.length - paths.length} more file(s)` : '';

                return [
                  pullRequest.title,
                  '',
                  'Changed files:',
                  ...paths,
                  omitted,
                ].filter(Boolean).join('\n');
              } catch (error) {
                core.warning(`Could not list PR files for fallback summary: ${error.message}`);
                return pullRequest.title;
              }
            }

            function fallbackSecurityImplications() {
              let reason = '';
              try {
                reason = compactWhitespace(JSON.parse(process.env.CLAUDE_STRUCTURED_OUTPUT || '{}')?.sdlc_reason || '');
              } catch (error) {
                core.warning(`Could not read Claude's SDLC reason: ${error.message}`);
              }

              if (reason) return `Has security impact - described as: ${reason}`;
              return 'Has security impact - described as: This PR is labeled `change: needs review`, but Claude did not provide specific security implications. Reviewers should confirm the actual impact on security, privacy, customer/user data, system stability, or critical functionality.';
            }

            function normalizeSecurityImplications(value) {
              const raw = (value || '').trim();
              if (!raw) return fallbackSecurityImplications();

              const lines = raw.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
              const checkedNoImpact = lines.some((line) => /^-\s*\[[xX]\]\s*No security impact\.?$/i.test(line));
              const checkedImpact = lines
                .map((line) => line.match(/^-\s*\[[xX]\]\s*Has security impact - described as:\s*(.+)$/i))
                .find(Boolean);

              if (checkedImpact?.[1]?.trim()) {
                return `Has security impact - described as: ${checkedImpact[1].trim()}`;
              }

              if (checkedNoImpact && !checkedImpact) return 'No security impact';
              if (/^No security impact\.?$/i.test(raw)) return 'No security impact';

              const impact = raw.match(/^Has security impact - described as:\s*([\s\S]+)$/i);
              if (impact?.[1]?.trim()) {
                return `Has security impact - described as: ${compactWhitespace(impact[1])}`;
              }

              const withoutCheckboxes = raw.replace(/^-\s*\[[ xX]\]\s*/gm, '').trim();
              const isPlaceholder = (
                !withoutCheckboxes ||
                /^Has security impact - described as:\s*$/i.test(withoutCheckboxes) ||
                (/No security impact/i.test(withoutCheckboxes) && /Has security impact - described as:\s*$/i.test(withoutCheckboxes))
              );
              if (isPlaceholder) return fallbackSecurityImplications();

              return `Has security impact - described as: ${compactWhitespace(raw)}`;
            }

            function normalizeTesting(value) {
              const raw = (value || '').trim();
              if (!raw || /^Describe how this was tested\.?$/i.test(raw)) {
                return 'Not run by Claude.';
              }

              return raw;
            }

            function testingWasFilled(value) {
              const raw = (value || '').trim();
              return Boolean(raw && !/^Not run by Claude\.?$/i.test(raw) && !/^Describe how this was tested\.?$/i.test(raw));
            }

            function issueDraftFromClaude() {
              try {
                const parsed = JSON.parse(process.env.CLAUDE_STRUCTURED_OUTPUT || '{}');
                const title = compactWhitespace(parsed.issue_title || '').replace(/^Track:\s*/i, '');
                const problem = (parsed.issue_problem || '').trim();
                const suggestedChanges = Array.isArray(parsed.issue_suggested_changes)
                  ? parsed.issue_suggested_changes
                    .map((item) => String(item || '').trim().replace(/^[-*]\s+/, ''))
                    .filter(Boolean)
                  : [];

                if (title && problem && suggestedChanges.length) {
                  return { title, problem, suggestedChanges };
                }

                core.warning('Claude did not return a complete issue draft. Using neutral fallback issue content.');
              } catch (error) {
                core.warning(`Could not parse Claude issue draft: ${error.message}. Using neutral fallback issue content.`);
              }

              return {
                title: compactWhitespace(pullRequest.title).replace(/^Track:\s*/i, ''),
                problem: 'The reported behavior remains unresolved and needs investigation.',
                suggestedChanges: [
                  'Confirm the affected behavior, impact, and underlying cause.',
                  'Define and validate an appropriate solution.',
                ],
              };
            }

            function buildIssueContent(issueDraft) {
              const title = truncate(issueDraft.title, 240);
              const suggestedChanges = issueDraft.suggestedChanges.map((item) => `- ${item}`);
              const body = [
                '## Problem',
                '',
                issueDraft.problem,
                '',
                '## Suggested changes',
                '',
                ...suggestedChanges,
              ].join('\n');

              return { title, body };
            }

            async function createTrackingIssue(targetOwner, targetRepo, issueContent) {
              const { data: issue } = await github.rest.issues.create({
                owner: targetOwner,
                repo: targetRepo,
                title: issueContent.title,
                body: issueContent.body,
              });

              return {
                ref: `${targetOwner}/${targetRepo}` === nameWithOwner ? `#${issue.number}` : `${targetOwner}/${targetRepo}#${issue.number}`,
                url: issue.html_url,
              };
            }

            const currentBody = pullRequest.body || '';
            const originalBody = Buffer.from(process.env.ORIGINAL_PR_BODY_BASE64 || '', 'base64').toString('utf8');
            const humanDescription = process.env.DESCRIPTION_PROVENANCE === 'human';
            const newerHumanDescription = (
              humanDescription &&
              currentBody !== originalBody &&
              await latestDescriptionEditIsHumanSinceCapture()
            );
            const sourceBody = humanDescription && !newerHumanDescription ? originalBody : currentBody;
            const existingIssueRef = (process.env.EXISTING_ISSUE_REF || '').trim();
            const linkedIssues = uniqueRefs([
              ...(existingIssueRef ? [{ ref: existingIssueRef, url: '' }] : []),
              ...(await closingIssueRefsFromGraphql()),
              ...closingIssueRefsFromBody(sourceBody),
              ...closingIssueRefsFromBody(currentBody),
            ]);

            let issueRef = linkedIssues[0]?.ref || '';

            if (!issueRef) {
              const issueContent = buildIssueContent(issueDraftFromClaude());
              const targets = [
                { owner: 'simpleanalytics', repo: 'dashboard' },
                { owner, repo },
              ].filter((target, index, targets) =>
                targets.findIndex((item) => item.owner === target.owner && item.repo === target.repo) === index
              );

              const failures = [];
              for (const target of targets) {
                try {
                  const createdIssue = await createTrackingIssue(target.owner, target.repo, issueContent);
                  issueRef = createdIssue.ref;
                  core.info(`Created review tracking issue ${createdIssue.ref}: ${createdIssue.url}`);
                  break;
                } catch (error) {
                  failures.push(`${target.owner}/${target.repo}: ${error.message}`);
                  core.warning(`Could not create review tracking issue in ${target.owner}/${target.repo}: ${error.message}`);
                }
              }

              if (!issueRef) {
                const suggestedIssue = `# ${issueContent.title}\n\n${issueContent.body}`;
                const comment = [
                  'Could not create a linked tracking issue automatically. Continuing without a linked issue.',
                  '',
                  `<details><summary>Suggested issue content</summary>`,
                  '',
                  '```markdown',
                  suggestedIssue.replace(/```/g, "'''"),
                  '```',
                  '',
                  '</details>',
                  '',
                  `Issue creation failures: ${failures.join('; ')}`,
                ].join('\n');

                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: comment,
                  });
                } catch (error) {
                  core.warning(`Could not add suggested issue content as a PR comment: ${error.message}`);
                }

                core.warning(`Could not create a linked review tracking issue. Continuing without issue reference. Failures: ${failures.join('; ')}`);
              }
            }

            let nextBody;

            if (humanDescription) {
              nextBody = ensureSummary(sourceBody, pullRequest.title);

              if (issueRef && !closingIssueRefsFromBody(nextBody).length) {
                const summary = extractSection(nextBody, 'Summary');
                nextBody = setSection(nextBody, 'Summary', [`Closes ${issueRef}`, summary].filter(Boolean).join('\n\n'));
              }

              const security = normalizeSecurityImplications(extractSection(nextBody, 'Security implications'));
              const testing = normalizeTesting(extractSection(nextBody, 'Testing'));
              const existingChecklist = extractSection(nextBody, 'Checklist');
              const checklist = normalizeChecklist(existingChecklist, {
                linkedIssue: Boolean(issueRef),
                tested: checked(existingChecklist, 'Tested') || testingWasFilled(testing),
                askedForReview: checked(existingChecklist, 'Asked for a review'),
              }, true);

              nextBody = setSection(nextBody, 'Security implications', security);
              nextBody = setSection(nextBody, 'Testing', testing);
              nextBody = setSection(nextBody, 'Checklist', checklist);
            } else {
              const existingSummary = extractSection(sourceBody, 'Summary');
              const existingSecurity = extractSection(sourceBody, 'Security implications');
              const existingTesting = extractSection(sourceBody, 'Testing');
              const existingChecklist = extractSection(sourceBody, 'Checklist');
              const manualSummary = cleanSummaryText(existingSummary);
              const fallbackSummary = manualSummary ? '' : await buildFallbackSummary();
              const commitChangeSummary = await buildCommitChangeSummary();
              const summary = [
                manualSummary || fallbackSummary,
                commitChangeSummary,
              ].filter(Boolean).join('\n\n').trim();
              const security = normalizeSecurityImplications(existingSecurity);
              const testing = normalizeTesting(existingTesting);
              const closingLine = issueRef ? `Closes ${issueRef}` : 'No linked issue was created automatically.';
              const checklist = normalizeChecklist('', {
                linkedIssue: Boolean(issueRef),
                tested: checked(existingChecklist, 'Tested') || testingWasFilled(testing),
                askedForReview: checked(existingChecklist, 'Asked for a review'),
              }, false);

              nextBody = [
                '## Summary',
                '',
                closingLine,
                '',
                summary,
                '',
                '## Security implications',
                '',
                security,
                '',
                '## Testing',
                '',
                testing,
                '',
                '## Checklist',
                '',
                checklist,
                '',
              ].join('\n');
            }

            nextBody = preserveProtectedMedia(originalBody, nextBody);

            if (nextBody.trim() !== currentBody.trim()) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                body: nextBody,
              });
              core.info(`Updated ${humanDescription ? 'human-authored' : 'automated'} PR body with required template sections and issue reference ${issueRef}.`);
            } else {
              core.info('PR body already matches the Simple Analytics PR template.');
            }

name: Pull Request

on:
  workflow_call:
    inputs:
      internal_app:
        description: "Set true for internal apps where low-risk changes do not require approval"
        type: boolean
        required: false
        default: false
      claude_model:
        description: "Claude model used for SDLC risk classification"
        type: string
        required: false
        default: claude-sonnet-5-5
      claude_extra_prompt:
        description: "Optional repository-specific Claude classification instructions"
        type: string
        required: false
        default: ""
      claude_allowed_bots:
        description: "Comma-separated bot actors allowed to trigger SDLC risk classification"
        type: string
        required: false
        default: "github-actions,github-actions[bot],simple-analytics-ai"
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  sdlc-label:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && github.event_name == 'pull_request' && contains(fromJson('["opened", "reopened", "synchronize"]'), github.event.action) }}
    concurrency:
      group: sdlc-label-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Ensure SDLC labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              {
                name: 'change: needs review',
                color: 'b60205',
                description: 'Significant or emergency change affecting security, data protection, or stability',
              },
              {
                name: 'change: routine',
                color: 'fbca04',
                description: 'Routine or ordinary change that needs at most one human or AI-assisted review',
              },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }

      - name: Capture existing SDLC label
        id: existing_sdlc_label
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const existingLabel = ['change: needs review', 'change: routine'].find((label) => labels.includes(label)) || '';
            core.setOutput('label', existingLabel);

      - name: Checkout pull request branch
        if: ${{ steps.existing_sdlc_label.outputs.label == '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch
        if: ${{ steps.existing_sdlc_label.outputs.label == '' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git remote add base "https://github.com/${{ github.repository }}.git" 2>/dev/null || git remote set-url base "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags --prune --depth=200 base "$BASE_REF"

      - name: Classify SDLC risk with Claude
        id: claude
        if: ${{ steps.existing_sdlc_label.outputs.label == '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: ${{ inputs.claude_allowed_bots }}
          prompt: |
            ## Pull request

            - Repository: ${{ github.repository }}
            - Pull request: #${{ github.event.pull_request.number }}
            - Base SHA: ${{ github.event.pull_request.base.sha }}
            - Head SHA: ${{ github.event.pull_request.head.sha }}
            - Internal app: ${{ inputs.internal_app }}

            ## Task

            Choose the SDLC risk label for this pull request and explain it in one sentence.
            Read the full change with `git log` and `git diff` from the base SHA to the head SHA. Read surrounding code only when the diff does not show the impact. Do not change anything.

            ## Release risk levels

            For SOC 2, our Software Release and Deployment Procedure gives every change one of four risk levels:

            | Change type | Description | Review requirement |
            | --- | --- | --- |
            | Routine Change | Standard, repeatable, low-risk changes with minimal operational impact | No formal review required |
            | Review Required Change | Changes affecting application behavior, infrastructure, integrations, or customer experience | One review required (human or approved AI-assisted review) |
            | Significant Change | High-impact changes, infrastructure modifications, security-sensitive changes, or changes with potential customer impact | Two reviews required, where at least one reviewer is human |
            | Emergency Change | Critical changes required to restore service availability or address security issues | May be implemented by authorized personnel with post-deployment review required |

            The label records the level:

            - `change: routine`: a Routine Change or Review Required Change. No human review is needed.
            - `change: needs review`: a Significant Change or Emergency Change. A human must review it.

            ## `change: needs review`

            Use it when the change materially affects:

            1. **Personal data:** who can access personal or sensitive data of customers, website visitors, or employees, or how that data is collected, stored, logged, shared, exported, retained, or deleted.
            2. **Production data outside production:** copying or anonymizing production data for debugging or testing.
            3. **Security:** authentication, authorization, permissions, encryption, existing secrets, or other security boundaries, including fixes for vulnerabilities in our code.
            4. **Billing:** prices, charges, invoices, subscriptions, or billing calculations.
            5. **Existing data:** migrations or operations that drop, rename, rewrite, or bulk-delete existing data.
            6. **Production infrastructure:** servers, networking, routing, DNS, TLS certificates, SSH, VPN, or firewall access, backups, stateful services, and the deployment and rollback path.
            7. **Reliability:** concurrency, queues, storage, or retries where the change creates a credible outage, data-loss, or corruption risk.
            8. **Emergency fix:** a fix that restores service during a production incident.

            ## `change: routine`

            Use it for every change that matches nothing in the `change: needs review` list, for example:

            1. **Product changes:** features and bug fixes.
            2. **Presentation:** UI, copy, content, and design.
            3. **Code health:** refactors, tests, and documentation.
            4. **Tooling:** internal and developer tooling.
            5. **Additive database changes:** new tables, columns, or indexes.
            6. **Non-production infrastructure:** CI checks, staging, monitoring dashboards, and alert rules.
            7. **Updates:** dependency, runtime, and image updates within the same major version.
            8. **New configuration:** new environment variables, feature flags, or tokens for a feature.

            ## How to decide

            1. Start from `change: routine`.
            2. Choose `change: needs review` only when you can point to the lines that make a change from its list.
            3. Touching production code, changing what users see, or mentioning data, security, or privacy is not enough.
            4. When in doubt, choose `change: routine`.
            5. If Internal app is true, choose `change: routine` unless the change matches the Personal data or Security item.
            6. The repository notes below refine both lists for that repository. When a note and a list disagree, the note wins.

            ## Output

            - `sdlc_label`: `change: routine` or `change: needs review`.
            - `sdlc_reason`: one sentence on the concrete impact, without the label or "because".
            - For `change: needs review`, end `sdlc_reason` with a link to the lines of the most critical change, for example `[src/auth.ts#L40-L52](https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/src/auth.ts#L40-L52)`. Take the line numbers from the `git diff` hunk headers. For a deletion, use the base SHA and the removed lines.

            ## Repository notes

            ### simpleanalytics/admin
            Internal admin panel with full access to customer accounts and subscriptions.
            Needs review: the SSO and group check in `index.js`; new or changed actions or views on customer data (`routes/customer/`, `routes/team/`, `routes/data/`); debug exports and their audit trail.

            ### simpleanalytics/ai-plugins
            Customer CLI, SDK, and agent skills that run with the customer's own API key.
            Needs review: storing, logging, or sending API keys anywhere except our API; destructive admin commands; removing the rule against personal data in event skills.

            ### simpleanalytics/assistant
            AI chat behind the dashboard that sends a customer's analytics to an AI provider.
            Needs review: token checks and team or website scoping in `src/server.ts`; tools or fetches that change which customer data goes to the AI provider; changing the AI provider or its data retention.

            ### simpleanalytics/boardroom
            Internal compliance app with employee personal data, contracts, and access reviews.
            Needs review: access rules (`src/proxy.ts`, `src/lib/auth-boundary.ts`, `src/lib/access-authorization.ts`, `src/server/auth/`); anything that lets an employee see other employees' data; encryption of personal data or credentials; deleting documents or evidence; the merged pull request review check.

            ### simpleanalytics/caddy-docker-image
            Web server image that serves TLS for customers' custom domains.
            Routine: Caddy v2 updates. Needs review: adding, removing, or changing plugins; major upgrades.

            ### simpleanalytics/common
            Shared library used by most services.
            Needs review: internal SSO auth (`src/internal-auth`); Elasticsearch templates, mappings, and retention (`src/elasticsearch`); certificate reloading (`src/ssl`); tax, currency, and plan helpers used for billing.

            ### simpleanalytics/cookie-report
            Cookie and consent scanner with a public scanner, employee login, and AI analysis.
            Routine: detection, scoring, AI prompts, report UI, and budget values in `src/config.ts`.
            Needs review: login and API key capabilities (`src/auth.ts`, `src/services/api-keys.ts`); who can see hidden or in-progress reports; URL fetch guards (`src/security/url.ts`, `src/ai/source-fetch.ts`); visitor IP handling (`src/services/marketing-admission.ts`); sending more than public scan evidence to the AI provider.

            ### simpleanalytics/dashboard
            Main customer app with accounts, teams, API keys, billing, and analytics exports.
            Needs review: login, signup, SSO, API and partner keys, team roles and invites (`src/services/auth.ts`, `src/db/partner-auth.ts`, `src/db/team.ts`); billing (`src/lib/stripe.ts`, `src/responders/pay`, payment webhooks and cron jobs); deletion and exports (`src/lib/data-deletion.ts`, `websites/export.ts`, `api/export`); making customer data public or sending it to third parties. `src/db/scheme.sql` runs on boot, so check it against the Existing data item.

            ### simpleanalytics/docs, simpleanalytics/status, simpleanalytics/.github
            Public static sites and templates. Always routine.

            ### simpleanalytics/dropzone
            Internal uploader that strips metadata and publishes files publicly.
            Needs review: metadata scrubbing in `src/server.ts`; overwriting existing public files; storage credentials.

            ### simpleanalytics/elasticsearch-api
            Internal API that queries, exports, migrates, and deletes visitor analytics.
            Routine: new or tuned read queries and aggregations.
            Needs review: delete, reindex, and migration endpoints (`server/rest/datapoints.js`, `server/rest/meta.js`, `lib/migration-query.js`, `scripts/migrate`); index mappings; exports (`server/rest/export.js`); basic auth in `server/index.js`; backup checks; hostname scoping of queries.

            ### simpleanalytics/github-actions
            Shared workflows, including production deploys and these risk labels.
            Needs review: `deploy.yml`; workflow permissions, secrets, and tokens; changes that let a pull request avoid `change: needs review`.

            ### simpleanalytics/ide-config
            Agent instructions and the GitHub token broker for developer machines.
            Needs review: `tools/github-app-token-broker/`; loosening the GitHub access rules in `AGENTS.md`.

            ### simpleanalytics/infrastructure
            Configuration for all of production.
            Routine: dashboards, alert rules, tests, docs, a new environment variable or token for a feature, same-major updates in `ansible/vars/docker_tags.yml`, and VPN rules that only connect one person's own devices.
            Needs review: SSH, VPN, and firewall access (`ansible/roles/ssh`, `ansible/vars/ssh.yml`, groups, tags, or cross-user rules in `ansible/roles/headscale/files/acl.json`); login gates (`ansible/vars/internal-services.yml`, router middlewares); DNS (`tofu/config/dns/`); TLS and certificate trust; rotating or removing existing secrets; backups; the deploy path (`scripts/deploy.sh`, `ansible/roles/apps`); stateful services such as Elasticsearch, RabbitMQ, and Redis.

            ### simpleanalytics/intranet
            Internal docs with runbooks and the SOC 2 policies.
            Needs review: policy text in `app/policies/`; pages with real credentials or customer data.

            ### simpleanalytics/marketing-site
            Public website whose server also handles signup, referral checks, job applications, and scanner visitor IPs.
            Needs review: what dashboard lookups expose (`plugins/affiliate.server.ts`, `server/api/is-public.get.ts`); the signup payload (`stores/signup.ts`); where applicant data goes (`server/api/jobs/`); scanner access, IP forwarding, and its API key (`server/api/cookie-scanner/`, `server/utils/cookie-scanner-security.ts`); server-side fetches of user-entered hosts (`server/utils/check-ssl.ts`).

            ### simpleanalytics/online
            Live visitor counter that streams pageviews to dashboard users.
            Needs review: subscriber authentication (`src/lib/authenticate.ts`, `src/lib/packethandler.ts`); which visit fields are broadcast (`src/routes/visit.ts`, `src/lib/sanitize.ts`).

            ### simpleanalytics/queue
            Ingestion service for every pageview and event.
            Routine: robot detection, block lists, and metrics.
            Needs review: what is stored or logged from a request (`lib/sanitize.js`, `lib/converters.js`, `utils/parse.js`, IP use in `router.js` and `lib/ips.js`); datastream routing (`utils/datastreams.js`); acknowledgements, retries, and rejections that can drop data (`rabbitmq/`).

            ### simpleanalytics/rabbitmq-docker-image
            Message broker image that buffers every incoming pageview.
            Routine: patch updates within the same minor version. Needs review: minor or major upgrades and plugin changes.

            ### simpleanalytics/recall
            Internal AI archive of employee chat history, newsletters, and de-identified support conversations.
            Needs review: roles, SSO, tokens, and MCP auth (`apps/web/src/server/auth.ts`, `permissions.ts`, `api-auth.ts`, `src/proxy.ts`); weakening the support privacy gate or raw data retention (`apps/privacy-worker`, `app/api/privacy/`); new sources that expose more employee or customer data; credential encryption and database roles; exports.

            ### simpleanalytics/screenshots
            Screenshot and image proxy that fetches any URL.
            Needs review: URL validation and fetching in `index.js`; cache purge credentials (`lib/cloudflare.js`).

            ### simpleanalytics/scripts
            The public tracking script that customer websites embed. Ignore generated `/dist` output.
            Routine: new payload fields that carry no personal data.
            Needs review: anything that could collect personal or identifying visitor data or ignore opt-outs (identifiers, cookies, storage, form values, unsanitized URLs or query values, Do Not Track, collection defaults); `deploy.mts` and `.github/workflows/release.yml`.

            ### simpleanalytics/shopify-app
            Shopify app that adds the script to stores and sends checkout events.
            Needs review: access scopes and webhooks in `shopify.app.toml`; auth and sessions (`app/shopify.server.ts`, `prisma/`); what checkout or customer data the pixel sends (`extensions/web-pixel/src/index.ts`); merchant API keys and data-request webhooks.

            ### simpleanalytics/simpleanalytics
            New monorepo for the next app version, not in production yet.
            Needs review: ClickHouse schema, views, and retention; backfills that copy production visitor data; cluster, replication, and backup configuration.

            ### simpleanalytics/simplecapture.com
            Encrypted screen-recording product.
            Needs review: encryption and key handling (`apps/web/src/lib/client-crypto.ts`); uploader-token and share-ID checks in `apps/web/src/app/api/`; retention and deletion jobs (`apps/worker/src/index.ts`).

            ### simpleanalytics/strapi
            CMS for marketing content.
            Routine: content types, admin tweaks, and same-major updates.
            Needs review: `.env.production`; public API permissions and auth (`src/extensions/users-permissions/`, `config/admin.js`, `config/middlewares.js`); removing or renaming content fields, which drops data; major upgrades.

            ### simpleanalytics/support-reminder
            Worker that posts support ticket counts to chat.
            Needs review: posting customer identifiers or conversation content, or writing to the support system.

            ### simpleanalytics/webflow-app
            Webflow app that adds the script to customer sites.
            Needs review: OAuth, sessions, and token storage (`data-client/app/api/auth/`, `data-client/app/lib/utils/database.ts`, `jwt.ts`); site checks in `data-client/app/api/scripts/` and `api/sites`; CORS in `data-client/proxy.ts`; script escaping in `scriptGenerator.ts`.

            ### simpleanalytics/wordpress-plugin
            WordPress plugin on customer sites, published weekly.
            Needs review: capability checks, sanitization, and escaping (especially `src/Support/OnloadCallback.php`); collecting more visitor data by default or changing IP handling (`src/TrackingRules.php`); the publishing path (`.github/workflows/release.yml`, `release.sh`).

            ## Additional instructions

            ${{ inputs.claude_extra_prompt }}
          claude_args: |
            --model ${{ inputs.claude_model }}
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Glob,Grep,Read"
            --json-schema '{"type":"object","properties":{"sdlc_label":{"type":"string","enum":["change: routine","change: needs review"]},"sdlc_reason":{"type":"string"}},"required":["sdlc_label","sdlc_reason"],"additionalProperties":false}'

      - name: Finalize SDLC label
        uses: actions/github-script@v9
        env:
          EXISTING_SDLC_LABEL: ${{ steps.existing_sdlc_label.outputs.label }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        with:
          script: |
            const needsReview = 'change: needs review';
            const routine = 'change: routine';
            const issueNumber = context.payload.pull_request.number;

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const currentLabel = [needsReview, routine].find((label) => labels.includes(label));
            const existingLabel = currentLabel || process.env.EXISTING_SDLC_LABEL;
            let assessment = {};
            try {
              assessment = JSON.parse(process.env.CLAUDE_STRUCTURED_OUTPUT || '{}') || {};
            } catch (error) {
              core.warning(`Could not read Claude's SDLC assessment: ${error.message}`);
            }
            const assessedLabel = [needsReview, routine].includes(assessment.sdlc_label) ? assessment.sdlc_label : '';
            const finalLabel = existingLabel || assessedLabel || routine;
            const reason = typeof assessment.sdlc_reason === 'string' ? assessment.sdlc_reason.trim() : '';
            let shouldComment = !existingLabel && Boolean(assessedLabel && reason);

            if (shouldComment) {
              const [comments, reviews] = await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                  per_page: 100,
                }),
              ]);
              shouldComment = ![...comments, ...reviews].some((message) => /\bSDLC label\s*:/i.test(message.body || ''));
            }

            if (!currentLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [finalLabel],
              });
            }

            if (shouldComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `SDLC label: \`${finalLabel}\` because ${reason}`,
              });
            }

            core.setOutput('label', finalLabel);
